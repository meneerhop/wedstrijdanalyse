<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASC Nieuwland 3 · Tegenstanders</title>
<link rel="icon" href="assets/logos/nieuwland.png">
<style>
:root{--wa:#d6342c;--nl:#2f5fd0;--fg:#161a26;--muted:rgba(28,34,56,.62);--line:rgba(20,30,70,.1)}
*{box-sizing:border-box}
html,body{margin:0;background:#eef1f8;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:16px}
.app{max-width:1120px;margin:0 auto;position:relative;isolation:isolate;overflow:hidden;padding:30px 22px 40px;border-radius:34px;display:flex;flex-direction:column;gap:36px;
background:radial-gradient(50% 38% at 6% 0%,rgba(47,95,208,.24),transparent 70%),radial-gradient(48% 38% at 98% 8%,rgba(214,52,44,.18),transparent 70%),radial-gradient(42% 28% at 18% 55%,rgba(47,95,208,.12),transparent 70%),radial-gradient(46% 30% at 90% 70%,rgba(140,90,220,.10),transparent 70%),linear-gradient(170deg,#fff 0%,#f5f6fb 50%,#eef1f8 100%)}
.glass{position:relative;background:linear-gradient(150deg,rgba(255,255,255,.82) 0%,rgba(255,255,255,.55) 55%,rgba(255,255,255,.62) 100%);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(20,30,70,.04),0 1px 2px rgba(20,30,70,.06),0 16px 36px -14px rgba(30,45,100,.28);border-radius:26px}
h1,h2,h3{margin:0;letter-spacing:-.025em}
.kicker{margin:0 0 4px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sub{margin:4px 0 0;color:var(--muted);line-height:1.5}

/* kop */
.head{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding:24px}
.badge{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 25%,#fff,rgba(255,255,255,.9));border:1px solid rgba(20,30,70,.08);box-shadow:inset 0 -6px 14px rgba(20,30,70,.05),0 14px 30px -10px rgba(30,45,100,.35),0 0 0 6px rgba(255,255,255,.7)}
.badge img{max-width:72%;max-height:78%}
.head h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{min-width:84px;padding:10px 14px;border-radius:18px;background:rgba(255,255,255,.7);border:1px solid rgba(20,30,70,.08);box-shadow:inset 0 1px 0 #fff;text-align:center}
.stat b{display:block;font-size:1.5rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--muted)}
.form{display:flex;gap:5px;margin-top:10px}
.pip{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 8px rgba(0,0,0,.18)}
.W{background:linear-gradient(160deg,#4cc47e,#22804a)}.G{background:linear-gradient(160deg,#f0bb45,#b88112)}.V{background:linear-gradient(160deg,#ec5d5d,#a92a2a)}

/* volgende wedstrijd */
.next{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;padding:26px;text-decoration:none;color:inherit;overflow:hidden;transition:transform .25s ease,box-shadow .25s ease}
.next:hover{transform:translateY(-3px);box-shadow:inset 0 1px 0 #fff,0 26px 50px -18px rgba(30,45,100,.4)}
.next .wm{position:absolute;right:-50px;top:-30px;width:300px;opacity:.08;transform:rotate(-10deg);pointer-events:none}
.next .vs{display:flex;align-items:center;gap:16px;margin:14px 0 10px}
.next .vs .badge{width:78px;height:78px}
.next .vs i{font-style:normal;font-weight:300;color:var(--muted)}
.next h2{font-size:clamp(1.4rem,3.5vw,2rem);font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--muted)}
.pred{text-align:center;padding:16px 20px;border-radius:22px;background:rgba(255,255,255,.65);border:1px solid rgba(20,30,70,.08);box-shadow:inset 0 1px 0 #fff;position:relative}
.pred small{display:block;font-size:.72rem;color:var(--muted)}
.pred b{display:block;font-size:2.6rem;font-weight:700;letter-spacing:-.04em;line-height:1.1}
.cta{display:inline-flex;align-items:center;gap:6px;margin-top:16px;padding:10px 18px;border-radius:999px;background:linear-gradient(160deg,#5a86f0,#2a54c2);color:#fff;font-weight:600;font-size:.92rem;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 22px -8px rgba(47,95,208,.7)}

/* tegels */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid rgba(20,30,70,.1);background:rgba(255,255,255,.65);border-radius:999px;padding:7px 14px;font:inherit;font-size:.85rem;color:var(--fg);cursor:pointer;box-shadow:inset 0 1px 0 #fff}
.chip[aria-pressed=true]{background:linear-gradient(160deg,#5a86f0,#2a54c2);color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:14px}
.tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:22px 16px 18px;text-decoration:none;color:inherit;transition:transform .25s ease,box-shadow .25s ease}
a.tile:hover{transform:translateY(-4px);box-shadow:inset 0 1px 0 #fff,0 24px 44px -16px rgba(30,45,100,.38)}
.tile .badge{width:84px;height:84px}
.tile .badge img{max-width:66%;max-height:70%}
.tile h3{font-size:1.08rem;font-weight:700}
.tile .pos{font-size:.8rem;color:var(--muted)}
.status{font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid transparent}
.s-klaar{background:rgba(46,158,91,.12);color:#1f7a45;border-color:rgba(46,158,91,.3)}
.s-volgt{background:rgba(20,30,70,.05);color:var(--muted);border-color:rgba(20,30,70,.1)}
.s-gespeeld{background:rgba(47,95,208,.08);color:#2a54c2;border-color:rgba(47,95,208,.25)}
.tile.dim{opacity:.72}
.tile .res{font-size:.85rem;font-weight:600}
.tile .go{font-size:.85rem;font-weight:600;color:#2a54c2}
.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:20px}

.foot{text-align:center;font-size:.75rem;color:var(--muted);margin-top:14px}

@media (max-width:640px){
body{padding:8px}
.app{padding:18px 12px 28px;border-radius:24px;gap:26px}
.head{grid-template-columns:auto 1fr;padding:18px;gap:14px}
.head .badge{width:68px;height:68px}
.head .stats{grid-column:1/-1}
.stat{flex:1;min-width:0;padding:8px}
.stat b{font-size:1.25rem}
.next{grid-template-columns:1fr;padding:20px}
.next .vs .badge{width:60px;height:60px}
.pred{display:flex;align-items:center;justify-content:space-between;text-align:left}
.pred b{font-size:2rem}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{padding:16px 10px 14px;border-radius:20px}
.tile .badge{width:64px;height:64px}
.tile h3{font-size:.95rem}
.status{font-size:.62rem;padding:3px 8px}
}
@media (prefers-reduced-motion:reduce){.next,.tile{transition:none}}
</style>
</head>
<body>
<main class="app">

<header class="head glass">
  <div class="badge"><img src="assets/logos/nieuwland.png" alt="Logo ASC Nieuwland"></div>
  <div>
    <p class="kicker">Wedstrijdanalyses · 5e klasse 10</p>
    <h1>ASC Nieuwland 3</h1>
    <div class="form" id="vorm"></div>
  </div>
  <div class="stats" id="stats"></div>
</header>

<section>
  <p class="kicker">Volgende wedstrijd</p>
  <a class="next glass" id="volgende" href="wasmeer/"></a>
</section>

<section>
  <p class="kicker">Tegenstanders</p>
  <h2 style="font-size:1.75rem;font-weight:700">Alle analyses</h2>
  <p class="sub">Klik op een tegenstander met een analyse. De andere analyses volgen voor de wedstrijd.</p>
  <div class="filters" role="group" aria-label="Filter">
    <button class="chip" data-f="alle" aria-pressed="true">Alle</button>
    <button class="chip" data-f="klaar" aria-pressed="false">Analyse klaar</button>
    <button class="chip" data-f="volgt" aria-pressed="false">Nog te spelen</button>
    <button class="chip" data-f="gespeeld" aria-pressed="false">Gespeeld</button>
  </div>
  <div class="grid" id="tegels" style="margin-top:16px"></div>
</section>

<p class="foot">Stand en uitslagen van voetbal.nl, bijgewerkt tot 25 november 2026.</p>
</main>

<script>
/* ===== Pas hier de gegevens aan =====
   status: 'klaar'    = analyse staat online (vul map in)
           'volgt'    = nog te spelen, analyse volgt
           'gespeeld' = al gespeeld (vul uitslag in, Nieuwland eerst)
   Een nieuwe analyse toevoegen: maak een map (bijv. huizen/) met een index.html,
   zet status op 'klaar' en map op 'huizen/'. */
const NIEUWLAND = {positie: 7, punten: 9, gespeeld: 5, voor: 13, tegen: 8, vorm: ['V', 'V', 'W', 'W', 'W']};

const VOLGENDE = {
  map: 'wasmeer/', team: 'Wasmeer 2', logo: 'assets/logos/wasmeer.png',
  datum: 'Zaterdag 28 november · 15:30', plek: "Sportpark Anna's Hoeve, Hilversum · veld 4", thuis: false,
  verwachting: '2 – 3'
};

const TEGENSTANDERS = [
  {team: 'Wasmeer 2', logo: 'wasmeer.png', positie: 8, punten: 9, status: 'klaar', map: 'wasmeer/', info: 'Za 28 nov · uit'},
  {team: 'AH’78 2', logo: 'ah78.png', positie: 1, punten: 18, status: 'gespeeld', uitslag: '0 – 4', resultaat: 'V', info: 'Uit · 26 sep'},
  {team: 'Sporting Almere 3', logo: 'sporting-almere-3.png', positie: 2, punten: 17, status: 'volgt'},
  {team: 'Spakenburg 4', logo: 'spakenburg.png', positie: 3, punten: 17, status: 'volgt'},
  {team: 'Sporting Almere 4', logo: 'sporting-almere-4.png', positie: 4, punten: 15, status: 'volgt'},
  {team: 'Forza Almere 2', logo: 'forza-almere.png', positie: 5, punten: 12, status: 'volgt'},
  {team: 'Huizen 3', logo: 'huizen.png', positie: 6, punten: 12, status: 'volgt'},
  {team: 'Altius 3', logo: 'altius.png', positie: 9, punten: 8, status: 'gespeeld', uitslag: '6 – 0', resultaat: 'W', info: 'Thuis · 24 okt'},
  {team: 'Laren 99 sv 3', logo: 'laren.png', positie: 10, punten: 7, status: 'gespeeld', uitslag: '1 – 3', resultaat: 'V', info: 'Uit · 10 okt'},
  {team: 'BVV ’31 2', logo: 'bvv31.png', positie: 11, punten: 7, status: 'volgt'},
  {team: 'NVC 2', logo: 'nvc.png', positie: 12, punten: 6, status: 'gespeeld', uitslag: '2 – 0', resultaat: 'W', info: 'Uit · 31 okt'},
  {team: 'Loosdrecht 4', logo: 'loosdrecht.png', positie: 13, punten: 1, status: 'gespeeld', uitslag: '4 – 1', resultaat: 'W', info: 'Thuis · 7 nov'},
  {team: 'Victoria 3', logo: 'victoria.png', positie: 14, punten: 0, status: 'volgt'}
];
/* ===== Einde gegevens ===== */

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const badge = (src, alt) => { const b = el('div', 'badge'); const i = el('img'); i.src = src; i.alt = alt; b.append(i); return b; };

// kop
const stats = document.getElementById('stats');
[[NIEUWLAND.positie + 'e', 'positie'], [NIEUWLAND.punten, 'punten'], [NIEUWLAND.gespeeld, 'gespeeld'], [NIEUWLAND.voor + '–' + NIEUWLAND.tegen, 'doelsaldo']].forEach(([v, l]) => { const s = el('div', 'stat'); s.append(el('b', '', v), el('span', '', l)); stats.append(s); });
const vorm = document.getElementById('vorm');
NIEUWLAND.vorm.forEach((r) => vorm.append(el('span', 'pip ' + r, r)));

// volgende wedstrijd
const n = document.getElementById('volgende');
n.href = VOLGENDE.map;
const wm = el('img', 'wm'); wm.src = VOLGENDE.logo; wm.alt = '';
const left = el('div');
const vs = el('div', 'vs');
const thuis = badge('assets/logos/nieuwland.png', 'ASC Nieuwland'), uit = badge(VOLGENDE.logo, VOLGENDE.team);
if (VOLGENDE.thuis) vs.append(thuis, el('i', '', 'vs'), uit); else vs.append(uit, el('i', '', 'vs'), thuis);
const meta = el('div', 'meta'); meta.append(el('span', '', VOLGENDE.datum), el('span', '', VOLGENDE.plek));
left.append(vs, el('h2', '', (VOLGENDE.thuis ? 'Nieuwland 3 – ' + VOLGENDE.team : VOLGENDE.team + ' – Nieuwland 3')), meta, el('span', 'cta', 'Bekijk analyse ›'));
const pred = el('div', 'pred'); pred.append(el('small', '', 'Verwachting'), el('b', '', VOLGENDE.verwachting), el('small', '', 'inschatting'));
n.append(wm, left, pred);

// tegels
const grid = document.getElementById('tegels');
function teken(filter) {
  const rij = TEGENSTANDERS.filter((t) => filter === 'alle' || t.status === filter);
  const orde = {klaar: 0, volgt: 1, gespeeld: 2};
  rij.sort((a, b) => orde[a.status] - orde[b.status] || a.positie - b.positie);
  grid.replaceChildren(...(rij.length ? rij.map((t) => {
    const link = t.status === 'klaar' && t.map;
    const tile = el(link ? 'a' : 'div', 'tile glass' + (link ? '' : ' dim'));
    if (link) tile.href = t.map;
    tile.append(badge('assets/logos/' + t.logo, 'Logo ' + t.team), el('h3', '', t.team), el('span', 'pos', t.positie + 'e · ' + t.punten + ' punten'));
    if (t.status === 'klaar') { tile.append(el('span', 'status s-klaar', 'Analyse klaar')); if (t.info) tile.append(el('span', 'pos', t.info)); tile.append(el('span', 'go', 'Open analyse ›')); }
    else if (t.status === 'gespeeld') { tile.append(el('span', 'status s-gespeeld', 'Gespeeld')); const r = el('span', 'res'); r.append(el('span', 'pip ' + t.resultaat, t.resultaat), ' Nieuwland ' + t.uitslag); r.style.display = 'flex'; r.style.alignItems = 'center'; r.style.gap = '6px'; tile.append(r); if (t.info) tile.append(el('span', 'pos', t.info)); }
    else { tile.append(el('span', 'status s-volgt', 'Analyse volgt')); }
    return tile;
  }) : [el('p', 'empty', 'Geen tegenstanders in deze selectie.')]));
}
document.querySelectorAll('.chip').forEach((c) => c.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach((x) => x.setAttribute('aria-pressed', String(x === c)));
  teken(c.dataset.f);
}));
teken('alle');
</script>
</body>
</html>
